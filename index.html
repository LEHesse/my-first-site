<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurens Hesse</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #e8e8e8;
      --accent: #64b5f6;
      --muted: #888;
      --card-bg: #1a1a1a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--bg);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .bio {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .links a {
      display: block;
      padding: 0.85rem 1.5rem;
      background: var(--card-bg);
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      transition: border-color 0.2s, background 0.2s;
      font-size: 1rem;
    }

    .links a:hover {
      border-color: var(--accent);
      background: #1f1f1f;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">LH</div>
    <h1>Laurens Hesse</h1>
    <p class="bio">Builder, learner, exploring the intersection of tech and ideas.</p>
    <div class="links">
      <a href="https://github.com/LEHesse" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/" target="_blank">LinkedIn</a>
    </div>
  </div>
</body>
</html>
